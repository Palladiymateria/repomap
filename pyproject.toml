[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomap-local"
version = "0.1.0"
description = "Turn a local project into a tree or a Markdown context bundle."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
repomap = "repomap.__main__:main"

[tool.setuptools.packages.find]
include = ["repomap*"]
